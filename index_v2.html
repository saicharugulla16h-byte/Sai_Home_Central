<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Budget Planner</title>
<style>
:root{
  --bg:#f7f8f6;--card:#fff;--line:#e7e9e5;--text:#20231f;--muted:#737a70;
  --green:#27663b;--green2:#eaf4ed;--red:#a3292d;--red2:#fbecec;
  --amber:#8a5a00;--amber2:#fff5df;--blue:#245b83;--blue2:#eaf3f9;
  --shadow:0 1px 3px rgba(25,35,25,.05),0 8px 24px rgba(25,35,25,.04);
  --r:14px;--font:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:230px;background:#fff;border-right:1px solid var(--line);padding:24px 14px;position:fixed;inset:0 auto 0 0;z-index:20}
.brand{font-size:18px;font-weight:700;padding:6px 12px 28px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}
.nav{display:grid;gap:4px}
.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:var(--muted);font-size:14px}
.nav button.active{background:var(--green2);color:var(--green);font-weight:600}
.sidebar-month{margin-top:28px;padding:12px;border:1px solid var(--line);border-radius:10px}
.sidebar-month small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.sidebar-month strong{font-size:14px}
.main{margin-left:230px;width:calc(100% - 230px);min-width:0}
.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10}
.topbar-title{font-size:15px;font-weight:600}
.topbar-actions{display:flex;gap:8px}
.page{max-width:1080px;margin:0 auto;padding:28px 30px 50px}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.month-nav h1{font-size:25px;margin:0;font-weight:650;letter-spacing:-.5px}
.month-nav .arrows{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);background:#fff;border-radius:9px;color:var(--text)}
.status{font-size:11px;border-radius:20px;padding:5px 9px;font-weight:600}
.draft{background:var(--amber2);color:var(--amber)}.final{background:var(--green2);color:var(--green)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.metric .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.metric .value{font-size:20px;font-weight:700;letter-spacing:-.3px}
.metric .value.negative{color:var(--red)}
.metric .value.positive{color:var(--green)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.card-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.card-head h2{font-size:13px;margin:0;font-weight:650}
.card-head span{font-size:13px;font-weight:650}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:56px}
.row:last-child{border-bottom:0}
.row-name{font-size:14px}.row-sub{font-size:11px;color:var(--muted);margin-top:3px}
.amount{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;text-align:right}
.row-input{width:130px;text-align:right;border:1px solid var(--line);background:#fafbfa;border-radius:8px;padding:8px 9px;outline:0}
.row-input:focus{border-color:var(--green);background:#fff}
.menu-btn{border:0;background:transparent;color:var(--muted);font-size:19px;width:30px;height:32px;border-radius:7px}
.menu-btn:hover{background:var(--bg)}
.add-row{padding:12px 16px;background:#fafbfa;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.add-row input,.add-row select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 9px;outline:0}
.add-row input.name{flex:1;min-width:140px}.add-row input.money{width:135px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font-size:13px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red);border-color:#f1d2d2}
.btn.full{width:100%}
.review{margin-top:4px;display:flex;gap:9px}
.review .btn{flex:1}
.notice{padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.notice.info{background:var(--blue2);color:var(--blue)}.notice.warn{background:var(--red2);color:var(--red)}
.formula{font-size:10px;color:var(--green);text-align:right;margin-top:2px;display:none}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13px}
.history-year{margin:18px 0 9px;font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.08em}
.history-row{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:8px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:12px;align-items:center}
.history-row strong{font-size:14px}.history-row small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}
.history-row .num{text-align:right;font-size:13px;font-weight:600}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setting-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.setting-card h2{font-size:14px;margin:0}.setting-card .head{padding:16px;border-bottom:1px solid var(--line)}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px}
.setting-item:last-child{border-bottom:0}
.setting-item .left{min-width:0}.setting-item strong{font-size:13px}.setting-item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.fx{font-size:10px;color:var(--green);margin-top:3px}
.modal-back{position:fixed;inset:0;background:rgba(20,25,20,.36);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:min(560px,100%);border-radius:16px 16px 0 0;padding:20px;max-height:88vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:18px}.modal p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.5}
.modal .field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;outline:0}
.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions>*{flex:1}
.toast{position:fixed;right:20px;bottom:20px;background:#20231f;color:#fff;padding:11px 14px;border-radius:9px;font-size:13px;z-index:200;display:none}
.mobile-nav{display:none}
@media(max-width:800px){
 .sidebar{display:none}.main{margin-left:0;width:100%}.topbar{height:58px;padding:0 16px}.topbar-title{font-size:14px}
 .page{padding:18px 14px 92px}.month-nav h1{font-size:22px}.summary{grid-template-columns:1fr 1fr}.grid,.settings-grid{grid-template-columns:1fr}
 .history-row{grid-template-columns:1fr 1fr}.history-row .num{text-align:left}.history-row .actions{grid-column:1/-1}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
 .mobile-nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px}.mobile-nav button.active{color:var(--green);font-weight:650}
 .review{position:sticky;bottom:76px;background:var(--bg);padding:8px 0;z-index:5}
 .toast{left:14px;right:14px;bottom:82px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">Budget Planner<small>Personal finance</small></div>
  <div class="nav">
    <button data-tab="plan" class="active" onclick="tab('plan')">Plan</button>
    <button data-tab="history" onclick="tab('history')">History</button>
    <button data-tab="settings" onclick="tab('settings')">Settings</button>
  </div>
  <div class="sidebar-month"><small>Current month</small><strong id="side-month"></strong></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="topbar-title">Budget</div>
    <div class="topbar-actions"><button class="btn" onclick="newMonth()">+ New Month</button></div>
  </header>
  <div class="page">
    <section id="plan-page"></section>
    <section id="history-page" style="display:none"></section>
    <section id="settings-page" style="display:none"></section>
  </div>
</main>
</div>
<nav class="mobile-nav">
  <button data-tab="plan" class="active" onclick="tab('plan')">Plan</button>
  <button data-tab="history" onclick="tab('history')">History</button>
  <button data-tab="settings" onclick="tab('settings')">Settings</button>
</nav>

<div class="modal-back" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal-body"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY='sai_budget_v2_clean';
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

const DEFAULT_FIXED=[
 {id:'f1',name:'LIC RD',amount:5500,due:'1st',raw:''},
 {id:'f2',name:'Avi Birthday Gold RD',amount:9080,due:'28th',raw:''},
 {id:'f3',name:'RD NPS',amount:4100,due:'2nd',raw:''},
 {id:'f4',name:'PPF 1',amount:12500,due:'3rd',raw:''},
 {id:'f5',name:'PPF 2',amount:12500,due:'5th',raw:''},
 {id:'f6',name:'Avi Fees RD',amount:11483,due:'2nd',raw:''},
 {id:'f7',name:'SIP',amount:15000,due:'5th',raw:''},
 {id:'f8',name:'Interiors RD',amount:62811,due:'4th',raw:''}
];
const DEFAULT_SOURCES=['HDFC','Bank of Maharashtra','SBI','ICICI'].map((name,i)=>({id:'s'+i,name}));

let S=load();
let activeTab='plan';

function emptyMonth(key){
 return {key,status:'draft',createdAt:new Date().toISOString(),funding:[],fixed:[],planned:[]};
}
function load(){
 try{
   const x=JSON.parse(localStorage.getItem(KEY)||'null');
   if(x) return x;
 }catch(e){}
 const now=new Date(), key=mk(now.getFullYear(),now.getMonth());
 const s={masters:{sources:DEFAULT_SOURCES,fixed:structuredClone(DEFAULT_FIXED),recurring:[],categories:[]},months:{},current:key};
 s.months[key]=newMonthFromMasters(key,s);
 return s;
}
function persist(){localStorage.setItem(KEY,JSON.stringify(S));}
function mk(y,m){return y+'-'+String(m+1).padStart(2,'0')}
function label(key){const [y,m]=key.split('-').map(Number);return MONTHS[m-1]+' '+y}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Math.round(Number(n||0)).toLocaleString('en-IN')}
function month(){return S.months[S.current]}
function fixedTotal(b){return (b.fixed||[]).reduce((a,x)=>a+Number(x.amount||0),0)}
function plannedTotal(b){return (b.planned||[]).reduce((a,x)=>a+Number(x.amount||0),0)}
function fundsTotal(b){return (b.funding||[]).reduce((a,x)=>a+Number(x.amount||0),0)}
function remaining(b){return fundsTotal(b)-fixedTotal(b)-plannedTotal(b)}
function evalExpr(raw){
 let s=String(raw??'').trim();
 if(s==='')return 0;
 if(!s.startsWith('=')){
   return /^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):0;
 }
 const e=s.slice(1);let i=0;
 function ws(){while(/\s/.test(e[i]||''))i++}
 function num(){ws();const m=e.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw 0;i+=m[0].length;return Number(m[0])}
 function factor(){ws();if(e[i]==='('){i++;const v=add();ws();if(e[i]!==')')throw 0;i++;return v}if(e[i]==='-'){i++;return-factor()}return num()}
 function mul(){let v=factor();for(;;){ws();if(e[i]==='*'){i++;v*=factor()}else if(e[i]==='/'){i++;const d=factor();if(d===0)throw 0;v/=d}else break}return v}
 function add(){let v=mul();for(;;){ws();if(e[i]==='+'){i++;v+=mul()}else if(e[i]==='-'){i++;v-=mul()}else break}return v}
 try{const v=add();ws();if(i!==e.length||!Number.isFinite(v))return null;return Math.round(v*100)/100}catch(e){return null}
}
function exprHint(raw){if(!String(raw||'').trim().startsWith('='))return '';const v=evalExpr(raw);return v===null?'Invalid formula':'= '+money(v)}

function newMonthFromMasters(key,s){
 const b=emptyMonth(key);
 b.funding=s.masters.sources.map(x=>({sourceId:x.id,name:x.name,amount:0,raw:''}));
 b.fixed=s.masters.fixed.map(x=>({...x}));
 b.planned=s.masters.recurring.map(x=>({id:'p'+Date.now()+Math.random(),name:x.name,amount:0,raw:'',due:x.due||'',isCC:!!x.isCC,category:x.category||''}));
 return b;
}
function ensure(){
 if(!S.masters)S.masters={sources:DEFAULT_SOURCES,fixed:structuredClone(DEFAULT_FIXED),recurring:[],categories:[]};
 if(!S.months)S.months={};
 if(!S.current||!S.months[S.current]){
  const now=new Date(),k=mk(now.getFullYear(),now.getMonth());S.current=k;
  if(!S.months[k])S.months[k]=newMonthFromMasters(k,S);
 }
}
function render(){
 ensure();persist();
 document.getElementById('side-month').textContent=label(S.current);
 document.getElementById('plan-page').style.display=activeTab==='plan'?'block':'none';
 document.getElementById('history-page').style.display=activeTab==='history'?'block':'none';
 document.getElementById('settings-page').style.display=activeTab==='settings'?'block':'none';
 document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===activeTab));
 if(activeTab==='plan')renderPlan();
 if(activeTab==='history')renderHistory();
 if(activeTab==='settings')renderSettings();
}
function tab(t){activeTab=t;render()}
function shiftMonth(dir){
 const [y,m]=S.current.split('-').map(Number),d=new Date(y,m-1+dir,1),k=mk(d.getFullYear(),d.getMonth());
 if(!S.months[k]){S.months[k]=newMonthFromMasters(k,S);toast(label(k)+' created')}
 S.current=k;render()
}
function newMonth(){
 const keys=Object.keys(S.months).sort(),last=keys[keys.length-1];
 const [y,m]=last.split('-').map(Number),d=new Date(y,m,1),k=mk(d.getFullYear(),d.getMonth());
 if(S.months[k]){S.current=k;render();return}
 S.months[k]=newMonthFromMasters(k,S);S.current=k;persist();render();toast(label(k)+' created from current masters');
}
function inputAmount(input,callback){
 const raw=input.value, v=evalExpr(raw);
 if(v===null){toast('Invalid amount or formula','error');input.focus();return}
 callback(v,raw);persist();render();
}
function renderPlan(){
 const b=month(),fund=fundsTotal(b),fix=fixedTotal(b),plan=plannedTotal(b),rem=remaining(b);
 let h=`<div class="month-nav">
  <div style="display:flex;align-items:center;gap:10px"><div><h1>${label(S.current)}</h1><div style="margin-top:5px"><span class="status ${b.status==='finalized'?'final':'draft'}">${b.status==='finalized'?'Finalized':'Draft'}</span></div></div></div>
  <div class="arrows"><button class="icon-btn" onclick="shiftMonth(-1)">‹</button><button class="icon-btn" onclick="shiftMonth(1)">›</button></div>
 </div>`;
 if(b.status==='finalized')h+=`<div class="notice info">This month is finalized. Its values are a historical snapshot and will not change when masters are edited. <button class="btn" style="margin-left:8px" onclick="editFinal()">Edit finalized month</button></div>`;
 if(rem<0)h+=`<div class="notice warn">Planned spending is ${money(Math.abs(rem))} above available funds.</div>`;
 h+=`<div class="summary">
  ${metric('Total Funds',fund,'')}
  ${metric('Fixed Commitments',fix,'')}
  ${metric('Planned Spending',plan,'')}
  ${metric('Unallocated',rem,rem<0?'negative':rem>0?'positive':'')}
 </div>`;
 h+=`<div class="grid">${renderFunding(b)}${renderFixed(b)}</div>${renderPlanned(b)}`;
 if(b.status!=='finalized')h+=`<div class="review"><button class="btn" onclick="review()">Review Budget</button><button class="btn primary" onclick="finalize()">Finalize Month</button></div>`;
 document.getElementById('plan-page').innerHTML=h;
}
function metric(l,v,c){return `<div class="metric"><div class="label">${l}</div><div class="value ${c}">${money(v)}</div></div>`}
function renderFunding(b){
 let rows='';
 (b.funding||[]).forEach((x,i)=>{
  const hint=exprHint(x.raw);
  rows+=`<div class="row"><div class="row-name">${esc(x.name)}</div><div><input class="row-input" value="${esc(x.raw!==''?x.raw:x.amount||'')}" placeholder="0 or =formula" onchange="setFunding(${i},this.value)">${hint?`<div class="formula">${hint}</div>`:''}</div><button class="menu-btn" onclick="itemMenu('funding',${i})">⋮</button></div>`;
 });
 return `<div class="card"><div class="card-head"><h2>Funding Sources</h2><span>${money(fundsTotal(b))}</span></div>${rows||'<div class="empty">No funding sources configured.</div>'}</div>`;
}
function renderFixed(b){
 let rows='';
 (b.fixed||[]).forEach((x,i)=>rows+=`<div class="row"><div><div class="row-name">${esc(x.name)}</div>${x.due?`<div class="row-sub">Due ${esc(x.due)}</div>`:''}</div><div class="amount">${money(x.amount)}</div><button class="menu-btn" onclick="itemMenu('fixed',${i})">⋮</button></div>`);
 return `<div class="card"><div class="card-head"><h2>Fixed Commitments</h2><span>${money(fixedTotal(b))}</span></div>${rows||'<div class="empty">No fixed commitments.</div>'}</div>`;
}
function renderPlanned(b){
 let rows='';
 (b.planned||[]).forEach((x,i)=>{
  rows+=`<div class="row"><div><div class="row-name">${esc(x.name)}</div><div class="row-sub">${x.isCC?'Credit card':(x.category||'Planned')}</div></div><div><input class="row-input" value="${esc(x.raw!==''?x.raw:x.amount||'')}" placeholder="0 or =formula" onchange="setPlanned(${i},this.value)"></div><button class="menu-btn" onclick="itemMenu('planned',${i})">⋮</button></div>`;
 });
 return `<div class="card"><div class="card-head"><h2>Planned Spending</h2><span>${money(plannedTotal(b))}</span></div>${rows||'<div class="empty">Nothing planned yet.</div>'}
 <div class="add-row"><input class="name" id="new-plan-name" placeholder="Expense name"><input class="money" id="new-plan-amt" placeholder="Amount or =formula"><input id="new-plan-due" style="width:70px" placeholder="Day"><button class="btn primary" onclick="addPlanned()">Add</button></div></div>`;
}
function setFunding(i,raw){const v=evalExpr(raw);if(v===null){toast('Invalid amount or formula','error');render();return}const x=month().funding[i];x.amount=v;x.raw=String(raw||'');persist();render()}
function setPlanned(i,raw){const v=evalExpr(raw);if(v===null){toast('Invalid amount or formula','error');render();return}const x=month().planned[i];x.amount=v;x.raw=String(raw||'');persist();render()}
function addPlanned(){
 const n=document.getElementById('new-plan-name').value.trim(),raw=document.getElementById('new-plan-amt').value.trim(),due=document.getElementById('new-plan-due').value.trim();
 if(!n){toast('Enter an expense name','error');return}const v=evalExpr(raw||'0');if(v===null){toast('Invalid amount or formula','error');return}
 month().planned.push({id:'p'+Date.now(),name:n,amount:v,raw:raw,due,isCC:false,category:''});persist();render();toast('Planned spending added')
}
function itemMenu(type,i){
 const b=month(),arr=type==='fixed'?b.fixed:type==='funding'?b.funding:b.planned,x=arr[i];
 const isMaster=false;
 let content=`<h2>${esc(x.name)}</h2><p>Change this month's amount. This does not change the master configuration.</p>
 <div class="field"><label>Amount</label><input id="modal-amount" value="${esc(x.raw!==''?x.raw:x.amount||'')}" placeholder="Amount or =formula"></div>
 <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveItem('${type}',${i})">Save</button></div>`;
 if(type==='planned')content+=`<div class="modal-actions"><button class="btn danger" onclick="removeItem('planned',${i})">Remove from this month</button></div>`;
 if(type==='funding')content+=`<div class="modal-actions"><button class="btn danger" onclick="removeItem('funding',${i})">Remove from this month</button></div>`;
 document.getElementById('modal-body').innerHTML=content;document.getElementById('modal').style.display='flex';
}
function saveItem(type,i){
 const raw=document.getElementById('modal-amount').value,v=evalExpr(raw);if(v===null){toast('Invalid amount or formula','error');return}
 const arr=type==='fixed'?month().fixed:type==='funding'?month().funding:month().planned;arr[i].amount=v;arr[i].raw=String(raw||'');persist();closeModal();render()
}
function removeItem(type,i){const arr=type==='funding'?month().funding:month().planned;arr.splice(i,1);persist();closeModal();render()}
function closeModal(){document.getElementById('modal').style.display='none'}
function review(){
 const b=month(),f=fundsTotal(b),x=fixedTotal(b),p=plannedTotal(b),r=remaining(b);
 let cls=r<0?'notice warn':r===0?'notice info':'notice info';
 document.getElementById('modal-body').innerHTML=`<h2>Review Budget</h2><p>Check the month before finalizing it.</p>
 <div class="${cls}">Unallocated: <strong>${money(r)}</strong></div>
 <div class="setting-item"><strong>Total Funds</strong><span>${money(f)}</span></div>
 <div class="setting-item"><strong>Fixed Commitments</strong><span>${money(x)}</span></div>
 <div class="setting-item"><strong>Planned Spending</strong><span>${money(p)}</span></div>
 <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button>${r>=0?'<button class="btn primary" onclick="closeModal();finalize()">Finalize Month</button>':''}</div>`;
 document.getElementById('modal').style.display='flex'
}
function finalize(){
 const b=month(),r=remaining(b);if(r<0){toast('Cannot finalize while budget is over funds','error');return}
 if(!confirm('Finalize '+label(S.current)+'? This locks the month as a historical snapshot.'))return;
 b.status='finalized';b.finalizedAt=new Date().toISOString();persist();render();toast(label(S.current)+' finalized')
}
function editFinal(){
 if(!confirm('Edit this finalized month? It will return to Draft and must be finalized again.'))return;
 month().status='draft';persist();render()
}
function renderHistory(){
 const keys=Object.keys(S.months).sort().reverse();
 let h=`<div class="month-nav"><h1>History</h1><button class="btn primary" onclick="newMonth()">+ New Month</button></div>`;
 if(!keys.length)h+='<div class="empty">No months yet.</div>';
 let year='';
 keys.forEach(k=>{
  const b=S.months[k],y=k.slice(0,4);
  if(y!==year){year=y;h+=`<div class="history-year">${y}</div>`}
  const r=remaining(b);
  h+=`<div class="history-row" onclick="S.current='${k}';tab('plan')">
    <div><small>Month</small><strong>${label(k)}</strong></div>
    <div class="num"><small>Funds</small>${money(fundsTotal(b))}</div>
    <div class="num"><small>Fixed</small>${money(fixedTotal(b))}</div>
    <div class="num"><small>Planned</small>${money(plannedTotal(b))}</div>
    <div class="actions"><span class="status ${b.status==='finalized'?'final':'draft'}">${b.status==='finalized'?'Finalized':'Draft'}</span></div>
  </div>`;
 });
 document.getElementById('history-page').innerHTML=h;
}
function renderSettings(){
 const m=S.masters;
 document.getElementById('settings-page').innerHTML=`
 <div class="month-nav"><h1>Settings</h1></div>
 <div class="settings-grid">
  ${masterCard('Funding Sources',m.sources.map((x,i)=>settingRow(x.name,'',()=>editMaster('source',i)),()=>addMaster('source')))}
  ${masterCard('Fixed Commitments',m.fixed.map((x,i)=>settingRow(x.name,(x.due?'Due '+x.due+' · ':'')+money(x.amount),()=>editMaster('fixed',i)),()=>addMaster('fixed')))}
  ${masterCard('Recurring Spending',m.recurring.map((x,i)=>settingRow(x.name,(x.due?'Due '+x.due+' · ':'')+(x.isCC?'Credit card':''),()=>editMaster('recurring',i)),()=>addMaster('recurring')))}
  ${masterCard('Categories',m.categories.map((x,i)=>settingRow(x.name,'',()=>removeMaster('category',i)),()=>addMaster('category')))}
 </div>
 <div class="setting-card" style="margin-top:14px"><div class="head"><h2>Google Sheets</h2></div>
  <div style="padding:16px"><div class="field"><label>Apps Script Web App URL</label><input id="sheets-url" value="${esc(S.sheetsUrl||'')}" placeholder="Paste your existing Apps Script Web App URL"></div>
  <button class="btn primary" onclick="saveSheets()">Save connection</button>
  <div style="font-size:11px;color:var(--muted);margin-top:9px">The existing spreadsheet remains the reporting layer. This setting is ready for the Sheets bridge; it does not create a new spreadsheet.</div></div>
 </div>
 <div class="setting-card" style="margin-top:14px"><div class="head"><h2>Local data</h2></div>
  <div style="padding:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportData()">Backup data</button><button class="btn danger" onclick="resetData()">Reset V2 data</button></div>
 </div>`;
}
function masterCard(title,body,add){
 return `<div class="setting-card"><div class="head"><h2>${title}</h2></div>${body||'<div class="empty">None configured.</div>'}<div class="add-row"><button class="btn primary" onclick="${add.name}()">+ Add</button></div></div>`
}
function settingRow(name,sub,fn){return `<div class="setting-item"><div class="left"><strong>${esc(name)}</strong><small>${esc(sub)}</small></div><button class="menu-btn" onclick="${fn.name}()">⋮</button></div>`}
function addMaster(type){
 let title=type==='source'?'Funding Source':type==='fixed'?'Fixed Commitment':type==='recurring'?'Recurring Spending':'Category';
 let fields=`<div class="field"><label>Name</label><input id="m-name" placeholder="${title}"></div>`;
 if(type==='fixed'||type==='recurring')fields+=`<div class="field"><label>${type==='fixed'?'Default amount':'Default amount'}</label><input id="m-amt" placeholder="Amount or =formula"></div><div class="field"><label>Due day</label><input id="m-due" placeholder="e.g. 5th"></div>`;
 if(type==='recurring')fields+=`<div class="field"><label>Type</label><select id="m-cc"><option value="0">Planned</option><option value="1">Credit card</option></select></div>`;
 document.getElementById('modal-body').innerHTML=`<h2>Add ${title}</h2>${fields}<div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMaster('${type}',-1)">Add</button></div>`;
 document.getElementById('modal').style.display='flex'
}
function editMaster(type,i){
 const arr=type==='source'?S.masters.sources:type==='fixed'?S.masters.fixed:S.masters.recurring,x=arr[i];
 let fields=`<div class="field"><label>Name</label><input id="m-name" value="${esc(x.name)}"></div>`;
 if(type==='fixed'||type==='recurring')fields+=`<div class="field"><label>Default amount</label><input id="m-amt" value="${esc(x.raw||x.amount||'')}" placeholder="Amount or =formula"></div><div class="field"><label>Due day</label><input id="m-due" value="${esc(x.due||'')}"></div>`;
 if(type==='recurring')fields+=`<div class="field"><label>Type</label><select id="m-cc"><option value="0" ${!x.isCC?'selected':''}>Planned</option><option value="1" ${x.isCC?'selected':''}>Credit card</option></select></div>`;
 document.getElementById('modal-body').innerHTML=`<h2>Edit ${esc(x.name)}</h2><p>Changes apply to future months only. Existing months keep their snapshots.</p>${fields}<div class="modal-actions"><button class="btn danger" onclick="removeMaster('${type}',${i})">Archive</button><button class="btn primary" onclick="saveMaster('${type}',${i})">Save</button></div>`;
 document.getElementById('modal').style.display='flex'
}
function saveMaster(type,i){
 const name=document.getElementById('m-name').value.trim();if(!name){toast('Enter a name','error');return}
 let x={id:(type[0]||'x')+Date.now(),name};
 if(type==='fixed'||type==='recurring'){
  const raw=document.getElementById('m-amt').value.trim(),v=evalExpr(raw||'0');if(v===null){toast('Invalid amount or formula','error');return}
  x.amount=v;x.raw=raw;x.due=document.getElementById('m-due').value.trim();
 }
 if(type==='recurring'){x.isCC=document.getElementById('m-cc').value==='1';x.category=''}
 if(type==='source')x.name=name;
 const arr=type==='source'?S.masters.sources:type==='fixed'?S.masters.fixed:S.masters.recurring;
 if(i<0)arr.push(x);else{const old=arr[i];x.id=old.id;arr[i]=x}
 persist();closeModal();renderSettings();toast('Master updated')
}
function removeMaster(type,i){
 if(!confirm('Archive this master? Existing months will not change.'))return;
 const arr=type==='source'?S.masters.sources:type==='fixed'?S.masters.fixed:S.masters.recurring;
 arr.splice(i,1);persist();closeModal();renderSettings()
}
function removeCategory(i){if(confirm('Remove this category from future setup?')){S.masters.categories.splice(i,1);persist();renderSettings()}}
function saveSheets(){S.sheetsUrl=document.getElementById('sheets-url').value.trim();persist();toast('Google Sheets setting saved')}
function exportData(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='budget-planner-backup.json';a.click();URL.revokeObjectURL(a.href)
}
function resetData(){if(confirm('Reset all V2 local data? This cannot be undone.')){localStorage.removeItem(KEY);S=load();render();toast('V2 data reset')}}
function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
ensure();render();
</script>
</body>
</html>
