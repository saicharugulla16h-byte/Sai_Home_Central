<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget — Sai">
<title>Budget Planner for Sai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2f4f1;
  --surface: #ffffff;
  --surface2: #f6f7f5;
  --border: #e4e7e1;
  --text: #1c2118;
  --text2: #5a6355;
  --text3: #9aa394;
  --accent: #2d6a3f;
  --accent-dark: #1e4d2c;
  --accent-light: #eaf4ec;
  --accent-mid: #4a9660;
  --green: #2d6a3f;
  --green-bg: #eaf4ec;
  --green-text: #1e4d2c;
  --red: #9b2226;
  --red-bg: #fce8e8;
  --red-text: #7a1a1d;
  --amber: #7d4e00;
  --amber-bg: #fff4e0;
  --amber-text: #5c3800;
  --blue: #1b4f72;
  --blue-bg: #e8f3fb;
  --blue-text: #0f3350;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 4px rgba(0,0,0,0.06), 0 2px 12px rgba(0,0,0,0.04);
  --font: 'Plus Jakarta Sans', -apple-system, 'Helvetica Neue', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; background: var(--bg); font-family: var(--font); color: var(--text); font-size: 15px; }

/* ── HEADER ── */
.header {
  background: linear-gradient(160deg, var(--accent) 0%, var(--accent-dark) 100%);
  padding: 54px 18px 0;
  position: sticky; top: 0; z-index: 100;
}
.header-top { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 14px; }
.header h1 { font-size: 21px; font-weight: 600; color: #fff; letter-spacing: -0.2px; }
.header-sub { font-size: 13px; color: rgba(255,255,255,0.62); margin-top: 2px; }
.month-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: #fff; font-size: 13px; padding: 7px 13px; border-radius: 20px; cursor: pointer; font-family: var(--font); white-space: nowrap; }
.month-btn:active { opacity: 0.75; }

/* ── TABS ── */
.tabs { display: flex; background: var(--accent-dark); padding: 0 4px; }
.tab { flex: 1; text-align: center; padding: 11px 4px; font-size: 12px; letter-spacing: 0.04em; color: rgba(255,255,255,0.5); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; font-family: var(--font); transition: color 0.15s; }
.tab.active { color: #fff; border-bottom-color: rgba(255,255,255,0.85); font-weight: 500; }

/* ── CONTENT ── */
.content { padding: 16px 14px 110px; max-width: 640px; margin: 0 auto; }

/* ── CARD ── */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden; }
.card-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text3); }
.card-total { font-size: 14px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }

/* ── EXPENSE ROW ── */
.exp-row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.exp-row:last-child { border-bottom: none; }
.exp-name { font-size: 15px; color: var(--text); line-height: 1.3; }
.exp-date { font-size: 12px; color: var(--text3); margin-top: 2px; }
.exp-badge-amt { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.exp-amt { font-size: 15px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; min-width: 80px; text-align: right; }

/* ── FUNDING SOURCES ROW ── */
.inc-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  min-height: 52px;
}
.inc-row:last-child { border-bottom: none; }
.inc-total-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  padding: 12px 16px;
  background: var(--surface2);
  min-height: 48px;
}
.inc-label { font-size: 15px; color: var(--text); }
.inc-total-label { font-size: 15px; font-weight: 600; color: var(--text); }

/* ── INPUT ── */
input[type=number], input[type=text] {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 15px;
  font-family: var(--font);
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--accent); background: #fff; }
.inc-input { width: 130px; text-align: right; }
.var-input { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
.formula-hint { font-size: 11px; color: var(--accent); margin-top: 3px; text-align: right; display: none; }

/* ── BADGE ── */
.badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0; }
.badge-fixed { background: var(--blue-bg); color: var(--blue-text); }
.badge-var   { background: var(--amber-bg); color: var(--amber-text); }
.badge-cc    { background: var(--red-bg); color: var(--red-text); }
.badge-frozen{ background: var(--green-bg); color: var(--green-text); }

/* ── METRICS ── */
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.metric { background: var(--surface); border-radius: var(--radius); padding: 13px 14px; box-shadow: var(--shadow); }
.metric-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 5px; }
.metric-val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.metric-val.pos { color: var(--green); }
.metric-val.neg { color: var(--red); }
.metric-val.warn { color: var(--amber); }

/* ── SUGGESTION ── */
.suggestion { background: var(--green-bg); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 11px 14px; margin-bottom: 14px; }
.suggestion-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--green); margin-bottom: 3px; }
.suggestion-text { font-size: 13px; color: var(--green-text); line-height: 1.5; }

/* ── BUTTONS ── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px; border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); font-weight: 500; cursor: pointer; border: none; -webkit-appearance: none; transition: opacity 0.15s, background 0.15s; }
.btn:active { opacity: 0.72; }
.btn:disabled { opacity: 0.38; pointer-events: none; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
.btn-ghost-red { background: transparent; color: var(--red); border: 1.5px solid var(--red-bg); padding: 7px 10px; font-size: 13px; }
.btn-cc { background: transparent; color: var(--blue); border: 1.5px solid var(--blue-bg); padding: 7px 11px; font-size: 13px; font-weight: 600; }
.btn-full { width: 100%; }
.btn-green { background: var(--green); color: #fff; }

/* ── ADD FORM ── */
.add-form { padding: 12px 16px; background: var(--surface2); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add-form input[type=text] { flex: 1; min-width: 110px; }
.add-form select { flex-shrink: 0; }

/* ── SELECT ── */
select {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  font-size: 14px;
  color: var(--text);
  font-family: var(--font);
  -webkit-appearance: none;
  outline: none;
}
select:focus { border-color: var(--accent); }

/* ── TALLY ── */
.tally-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px; }
.tally-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
.tally-row:last-child { border-bottom: none; }
.tally-row.total { font-weight: 600; font-size: 15px; background: var(--surface2); }
.tally-diff { font-size: 22px; font-weight: 700; text-align: center; padding: 14px; border-radius: var(--radius-sm); margin: 10px 0; font-variant-numeric: tabular-nums; }
.tally-ok   { background: var(--green-bg); color: var(--green); }
.tally-over { background: var(--red-bg); color: var(--red); }
.tally-under{ background: var(--amber-bg); color: var(--amber); }
.tally-msg { font-size: 13px; text-align: center; color: var(--text2); padding: 0 8px 10px; line-height: 1.55; }

/* ── MODALS ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: flex; align-items: flex-end; justify-content: center; }
.modal-sheet { background: var(--surface); border-radius: var(--radius) var(--radius) 0 0; padding: 24px 18px 42px; width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; }
.modal-sheet h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.modal-sheet p { font-size: 14px; color: var(--text2); margin-bottom: 18px; line-height: 1.5; }
.modal-btns { display: flex; gap: 10px; margin-top: 16px; }

/* ── HISTORY ── */
.hist-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
.hist-card:active { opacity: 0.72; }
.hist-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.hist-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.hist-stat { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.hist-stat-label { font-size: 11px; color: var(--text3); margin-bottom: 2px; }

/* ── SETTINGS ── */
.setting-block { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.setting-block:last-child { border-bottom: none; }
.setting-label { font-size: 13px; color: var(--text2); margin-bottom: 7px; font-weight: 500; }
.setting-note { font-size: 12px; color: var(--text3); margin-top: 6px; line-height: 1.6; }
.code-box { background: #1c2118; color: #c8d8c0; border-radius: var(--radius-sm); padding: 13px 14px; font-size: 11.5px; font-family: 'Courier New', monospace; overflow-x: auto; margin: 8px 0; line-height: 1.65; white-space: pre; }

/* ── FROZEN NOTICE ── */
.frozen-notice { display: flex; align-items: center; gap: 8px; background: var(--green-bg); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px; font-size: 13px; color: var(--green-text); font-weight: 500; }

/* ── BOTTOM BAR ── */
.bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 14px 32px; display: flex; gap: 10px; z-index: 90; }

/* ── ALERT TOAST ── */
.toast { padding: 11px 16px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; margin-bottom: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
.toast-ok   { background: var(--green-bg); color: var(--green-text); }
.toast-warn { background: var(--amber-bg); color: var(--amber-text); }
.toast-err  { background: var(--red-bg); color: var(--red-text); }

/* ── MONTH PICKER ── */
.mpicker-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); margin-bottom: 8px; cursor: pointer; }
.mpicker-item.current { border-color: var(--accent); background: var(--green-bg); }
.mpicker-item:active { opacity: 0.72; }

.empty { text-align: center; padding: 28px 20px; color: var(--text3); font-size: 14px; }

@media (min-width: 560px) {
  .header { padding: 22px 20px 0; }
  .content { padding: 18px 18px 110px; }
  .metrics { grid-template-columns: repeat(4, 1fr); }
  .inc-input { width: 150px; }
}

@media (min-width: 900px) {
  body { background: #eef1ed; }
  .header { position: sticky; top: 0; padding: 24px 28px 0; }
  .header-top { max-width: 1180px; margin: 0 auto; }
  .tabs { max-width: 1180px; margin: 0 auto; }
  .content { max-width: 1180px; padding: 24px 28px 40px; }
  #tab-plan { max-width: 980px; margin: 0 auto; }
  #tab-history, #tab-settings { max-width: 980px; margin: 0 auto; }
  .bottom-bar { position: sticky; bottom: 0; max-width: 980px; margin: 0 auto; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
}

</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <h1>Budget Planner <span style="font-weight:400; opacity:0.72; font-size:17px;">for Sai</span></h1>
      <div class="header-sub" id="hdr-month"></div>
    </div>
    <button class="month-btn" onclick="openMonthPicker()">Switch month ▾</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('plan')">Plan</button>
    <button class="tab" onclick="switchTab('history')">History</button>
    <button class="tab" onclick="switchTab('settings')">Settings</button>
  </div>
</div>

<div class="content">
  <div id="tab-plan"></div>
  <div id="tab-history" style="display:none;"></div>
  <div id="tab-settings" style="display:none;"></div>
</div>

<div class="bottom-bar" id="bottom-bar" style="display:none;flex-direction:column;gap:6px;padding-bottom:36px;">
  <div style="display:flex;gap:10px;width:100%;">
    <button class="btn btn-outline" style="flex:1;" onclick="runTally()">Review Budget</button>
    <button class="btn btn-primary" style="flex:1;" id="save-btn" onclick="trySave()" disabled>Update Sheets Now</button>
  </div>
  <div id="sync-timestamps" style="font-size:11px;color:var(--text3);text-align:center;display:flex;gap:12px;justify-content:center;"></div>
</div>

<!-- Authentication -->
<div class="modal-overlay" id="auth-modal" style="display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:1000;">
  <div class="modal-sheet" style="border-radius:var(--radius);max-width:420px;margin:18px;padding:28px 22px;box-shadow:var(--shadow);">
    <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px;">Budget Planner</div>
    <h2>Sign in</h2>
    <p>Use your email to access your budget securely across devices.</p>
    <input type="email" id="auth-email" style="width:100%;" placeholder="you@example.com" autocomplete="email" />
    <button class="btn btn-primary btn-full" style="margin-top:12px;" onclick="sendMagicLink()" id="auth-btn">Send sign-in link</button>
    <div id="auth-msg" style="font-size:12px;color:var(--text2);margin-top:12px;line-height:1.5;"></div>
  </div>
</div>

<!-- Month picker -->
<div class="modal-overlay" id="mpicker-modal" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-sheet">
    <h2 style="margin-bottom:14px;">Select Month</h2>
    <div id="mpicker-list"></div>
    <button class="btn btn-outline btn-full" onclick="createNewMonth()" style="margin-top:4px;">+ New Month</button>
    <button class="btn btn-outline btn-full" onclick="document.getElementById('mpicker-modal').style.display='none'" style="margin-top:8px; color:var(--text3);">Cancel</button>
  </div>
</div>

<!-- CC modal -->
<div class="modal-overlay" id="cc-modal" style="display:none;">
  <div class="modal-sheet">
    <h2 id="cc-title">CC Payment</h2>
    <p id="cc-desc"></p>
    <div style="margin-bottom:4px;">
      <div class="setting-label">Amount to pay this month</div>
      <input type="text" id="cc-input" style="width:100%;" placeholder="Enter amount or =expression" oninput="ccFormulaHint()" />
      <div class="formula-hint" id="cc-hint"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" style="flex:1;" onclick="setCCFull()">Pay full amount</button>
      <button class="btn btn-primary" style="flex:1;" onclick="setCCCustom()">Use this amount</button>
    </div>
    <button class="btn btn-outline btn-full" onclick="document.getElementById('cc-modal').style.display='none'" style="margin-top:10px;color:var(--text3);">Cancel</button>
  </div>
</div>

<!-- Tally modal -->
<div class="modal-overlay" id="tally-modal" style="display:none;" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal-sheet">
    <h2 style="margin-bottom:16px;">Review Budget</h2>
    <div id="tally-content"></div>
    <div class="modal-btns" id="tally-btns"></div>
  </div>
</div>

<!-- Action menu -->
<div class="modal-overlay" id="action-modal" style="display:none;" onclick="if(event.target===this)closeActionMenu()">
  <div class="modal-sheet">
    <h2 id="action-title">Edit item</h2>
    <div id="action-content"></div>
    <div class="modal-btns" id="action-btns"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toasts" style="position:fixed;top:130px;left:14px;right:14px;z-index:500;pointer-events:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ─── SUPABASE CONFIG ─────────────────────────────────────────────────────────
const SUPABASE_URL = "https://dczjjbckmulhwglosvzc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_9JbtoteK2-Po1RQucJ005A_QbDNgIjs";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let AUTH_USER = null;
let DB_READY = false;
let DB_SAVE_TIMER = null;
let DB_LOADING = false;

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ─── STATE ───────────────────────────────────────────────────────────────────
let S = { currentKey:'', budgets:{}, fixedExpenses:[], varExpenseTemplates:[], fundingSources:[], categories:[], webhookUrl:'', lastSaved:null, lastSynced:null };
let activeCCIdx = -1;
let activeTab = 'plan';

function defaultFixed() {
  return [
    {id:1, name:'LIC RD',            amount:5500,  date:'1st'},
    {id:2, name:'Avi Birthday Gold RD', amount:9080, date:'28th'},
    {id:3, name:'RD NPS',            amount:4100,  date:'2nd'},
    {id:4, name:'PPF 1',             amount:12500, date:'3rd'},
    {id:5, name:'PPF 2',             amount:12500, date:'5th'},
    {id:6, name:'Avi Fees RD',       amount:11483, date:'2nd'},
    {id:7, name:'SIP',               amount:15000, date:'5th'},
    {id:8, name:'Interiors RD',      amount:62811, date:'4th'},
  ];
}

function monthKey(y,m) { return `${y}-${String(m+1).padStart(2,'0')}`; }
function monthLabel(key) {
  const [y,m] = key.split('-');
  return `${MONTH_NAMES[parseInt(m)-1]} ${y}`;
}

// ─── PERSISTENCE / SUPABASE ───────────────────────────────────────────────────
function saveS() {
  if (!AUTH_USER || DB_LOADING) return;
  clearTimeout(DB_SAVE_TIMER);
  DB_SAVE_TIMER = setTimeout(() => persistCurrentState().catch(e => {
    console.error(e);
    toast('Could not save changes to Supabase','err');
  }), 250);
}

function emptyBudget(key) {
  return { key, frozen:false, fundingSnapshot:[], fixedSnapshot:[], variableExpenses:[], tallyApproved:false, createdAt:new Date().toISOString() };
}

async function sendMagicLink() {
  const email = document.getElementById('auth-email').value.trim();
  const msg = document.getElementById('auth-msg');
  const btn = document.getElementById('auth-btn');
  if (!email) { msg.textContent='Enter your email address.'; return; }
  btn.disabled=true; btn.textContent='Sending…'; msg.textContent='';
  const {error} = await supabaseClient.auth.signInWithOtp({
    email,
    options:{emailRedirectTo:'https://saicharugulla16h-byte.github.io/Sai_Home_Central/index_v2.html'}
  });
  if(error){ msg.textContent=error.message; btn.disabled=false; btn.textContent='Send sign-in link'; return; }
  msg.textContent='Sign-in link sent. Check your email, then return to this page.';
  btn.disabled=false; btn.textContent='Send sign-in link';
}

function showAuth(show) {
  const m=document.getElementById('auth-modal');
  if(m) m.style.display=show?'flex':'none';
}

async function ensureProfile() {
  const {error}=await supabaseClient.from('profiles').upsert({
    user_id:AUTH_USER.id,
    display_name:AUTH_USER.user_metadata?.full_name || AUTH_USER.user_metadata?.name || AUTH_USER.email?.split('@')[0] || 'Budget User'
  },{onConflict:'user_id'});
  if(error) throw error;
  await supabaseClient.from('app_settings').upsert({user_id:AUTH_USER.id},{onConflict:'user_id'});
}

async function loadRemoteState() {
  DB_LOADING=true;
  try {
    await ensureProfile();
    const [fs,fc,rs,cat,bu] = await Promise.all([
      supabaseClient.from('funding_sources').select('*').order('sort_order'),
      supabaseClient.from('fixed_commitments').select('*').order('sort_order'),
      supabaseClient.from('recurring_spending').select('*').order('sort_order'),
      supabaseClient.from('categories').select('*').order('sort_order'),
      supabaseClient.from('budgets').select('*').order('month_start',{ascending:false})
    ]);
    for(const r of [fs,fc,rs,cat,bu]) if(r.error) throw r.error;

    // Seed masters only for a genuinely empty account.
    if(!fc.data.length){
      const defaults=defaultFixed().map((e,i)=>({user_id:AUTH_USER.id,name:e.name,default_amount:e.amount,due_day:parseInt(e.date),sort_order:i,is_active:true}));
      const {error}=await supabaseClient.from('fixed_commitments').insert(defaults); if(error) throw error;
      fc.data=defaults.map((x,i)=>({...x,id:'seed-'+i}));
    }
    if(!fs.data.length){
      const defaults=['HDFC','Bank of Maharashtra','SBI','ICICI'].map((name,i)=>({user_id:AUTH_USER.id,name,sort_order:i,is_active:true}));
      const {error}=await supabaseClient.from('funding_sources').insert(defaults); if(error) throw error;
      fs.data=defaults.map((x,i)=>({...x,id:'seed-fs-'+i}));
    }

    S.fixedExpenses=(fc.data||[]).filter(x=>x.is_active).map(x=>({id:x.id,name:x.name,amount:Number(x.default_amount||0),date:x.due_day?x.due_day+'th':'',rawInput:x.raw_input||''}));
    S.varExpenseTemplates=(rs.data||[]).filter(x=>x.is_active).map(x=>({id:x.id,name:x.name,date:x.due_day?x.due_day+'th':'',isCC:!!x.is_credit_card,amount:Number(x.default_amount||0),rawInput:x.raw_input||''}));
    S.fundingSources=(fs.data||[]).filter(x=>x.is_active).map(x=>({id:x.id,name:x.name,sortOrder:x.sort_order}));
    S.categories=(cat.data||[]).filter(x=>x.is_active).map(x=>({id:x.id,name:x.name,sortOrder:x.sort_order}));
    S.budgets={};

    for(const row of (bu.data||[])){
      const key=row.month_start.slice(0,7);
      S.budgets[key]=emptyBudget(key);
      S.budgets[key].id=row.id;
      S.budgets[key].frozen=row.status==='finalized';
      S.budgets[key].createdAt=row.created_at;
      const [f,fix,p] = await Promise.all([
        supabaseClient.from('budget_funding_sources').select('*').eq('budget_id',row.id).order('sort_order'),
        supabaseClient.from('budget_fixed_commitments').select('*').eq('budget_id',row.id).order('sort_order'),
        supabaseClient.from('budget_planned_spending').select('*').eq('budget_id',row.id).order('sort_order')
      ]);
      for(const r of [f,fix,p]) if(r.error) throw r.error;
      const b=S.budgets[key];
      b.fundingSnapshot=(f.data||[]).map(x=>({id:x.id,sourceId:x.source_id||null,name:x.source_name,amount:Number(x.amount||0),rawInput:x.raw_input||'',sortOrder:x.sort_order||0}));
      b.variableExpenses=(p.data||[]).map(x=>({id:x.id,name:x.name,amount:Number(x.amount||0),rawInput:x.raw_input||'',date:x.due_day?x.due_day+'th':'',isCC:!!x.is_credit_card,category:x.category||''}));
      // Historical fixed commitments are snapshots, not live masters.
      if(fix.data?.length) b.fixedSnapshot=fix.data.map(x=>({id:x.id,name:x.commitment_name,amount:Number(x.amount||0),rawInput:x.raw_input||'',date:x.due_day?x.due_day+'th':''}));
    }

    const now=new Date();
    const key=monthKey(now.getFullYear(),now.getMonth());
    if(!S.budgets[key]){
      await createBudgetInDb(key);
    }
    S.currentKey=S.currentKey && S.budgets[S.currentKey] ? S.currentKey : key;
    DB_READY=true;
    renderAll();
  } finally { DB_LOADING=false; }
}

async function createBudgetInDb(key){
  const monthStart=key+'-01';
  const {data,error}=await supabaseClient.from('budgets')
    .insert({user_id:AUTH_USER.id,month_start:monthStart,status:'draft'})
    .select().single();
  if(error) throw error;

  const b=emptyBudget(key);
  b.id=data.id;

  b.fundingSnapshot=(S.fundingSources||[]).map((e,i)=>({
    sourceId:e.id,name:e.name,amount:0,rawInput:'',sortOrder:i
  }));

  b.fixedSnapshot=(S.fixedExpenses||[]).map(e=>({
    name:e.name,amount:Number(e.amount||0),rawInput:e.rawInput||'',date:e.date||'',id:null
  }));

  b.variableExpenses=(S.varExpenseTemplates||[]).map(e=>({
    name:e.name,amount:0,rawInput:'',date:e.date||'',isCC:!!e.isCC,category:e.category||''
  }));

  S.budgets[key]=b;
  await replaceBudgetChildren(b);
}

function monthlyFixed(b){ return b.fixedSnapshot || S.fixedExpenses; }
function totalFixedForBudget(b){ return monthlyFixed(b).reduce((s,e)=>s+Number(e.amount||0),0); }

async function replaceBudgetChildren(b){
  if(!b?.id || b.frozen) return;

  for(const table of ['budget_funding_sources','budget_fixed_commitments','budget_planned_spending']){
    const {error}=await supabaseClient.from(table).delete().eq('budget_id',b.id);
    if(error) throw error;
  }

  const sourceValues=fundingSnapshot(b).map((e,i)=>({
    budget_id:b.id,user_id:AUTH_USER.id,
    source_id:e.sourceId||null,source_name:e.name,
    amount:Number(e.amount||0),raw_input:e.rawInput||null,sort_order:i
  }));

  const fixedValues=monthlyFixed(b).map((e,i)=>({
    budget_id:b.id,user_id:AUTH_USER.id,
    commitment_name:e.name,amount:Number(e.amount||0),
    raw_input:e.rawInput||null,due_day:e.date?parseInt(e.date):null,sort_order:i
  }));

  const plannedValues=(b.variableExpenses||[]).map((e,i)=>({
    budget_id:b.id,user_id:AUTH_USER.id,name:e.name,
    amount:Number(e.amount||0),raw_input:e.rawInput||null,
    due_day:e.date?parseInt(e.date):null,is_credit_card:!!e.isCC,
    category:e.category||null,sort_order:i
  }));

  for(const [table,values] of [
    ['budget_funding_sources',sourceValues],
    ['budget_fixed_commitments',fixedValues],
    ['budget_planned_spending',plannedValues]
  ]){
    if(values.length){
      const {error}=await supabaseClient.from(table).insert(values);
      if(error) throw error;
    }
  }
}

async function persistCurrentState(){
  if(!AUTH_USER||!DB_READY)return;
  const b=B();

  const masterTables = [
    ['fixed_commitments', S.fixedExpenses||[], (e,i)=>({
      user_id:AUTH_USER.id,name:e.name,default_amount:Number(e.amount||0),
      raw_input:e.rawInput||null,due_day:e.date?parseInt(e.date):null,
      sort_order:i,is_active:true
    })],
    ['funding_sources', S.fundingSources||[], (e,i)=>({
      user_id:AUTH_USER.id,name:e.name,sort_order:i,is_active:true
    })],
    ['recurring_spending', S.varExpenseTemplates||[], (e,i)=>({
      user_id:AUTH_USER.id,name:e.name,default_amount:Number(e.amount||0),
      raw_input:e.rawInput||null,due_day:e.date?parseInt(e.date):null,
      is_credit_card:!!e.isCC,category:e.category||null,sort_order:i,is_active:true
    })],
    ['categories', S.categories||[], (e,i)=>({
      user_id:AUTH_USER.id,name:e.name,sort_order:i,is_active:true
    })]
  ];

  for(const [table,items,map] of masterTables){
    if(!items.length) continue;
    const {error}=await supabaseClient.from(table).upsert(items.map(map),{onConflict:'id'});
    if(error) console.warn(table,error);
  }

  if(b.id){
    const {error}=await supabaseClient.from('budgets').update({
      status:b.frozen?'finalized':'draft',
      finalized_at:b.frozen?(b.finalizedAt||new Date().toISOString()):null
    }).eq('id',b.id).eq('user_id',AUTH_USER.id);
    if(error)throw error;
    if(!b.frozen) await replaceBudgetChildren(b);
  } else {
    await createBudgetInDb(S.currentKey);
  }
}

async function init() {
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session){ AUTH_USER=session.user; showAuth(false); try{ await loadRemoteState(); }catch(e){ console.error(e); showAuth(false); toast('Could not load your budget data: '+e.message,'err'); } }
  else showAuth(true);
  supabaseClient.auth.onAuthStateChange(async (_event,session2)=>{
    if(session2?.user && !AUTH_USER){ AUTH_USER=session2.user; showAuth(false); try{await loadRemoteState();}catch(e){console.error(e);toast('Could not load budget data','err');} }
    else if(!session2){ AUTH_USER=null; DB_READY=false; showAuth(true); }
  });
}



// ─── MATHS ───────────────────────────────────────────────────────────────────
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n) {
  const v = Number(n || 0);
  return '₹' + Math.round(v).toLocaleString('en-IN');
}
function totalIncome(b) {
  return (b.fundingSnapshot || []).reduce((s,e) => s + Number(e.amount || 0), 0);
}
function fundingSnapshot(b) {
  return b.fundingSnapshot || (S.fundingSources || []).map((e,i)=>({id:e.id,name:e.name,amount:0,rawInput:'',sortOrder:i}));
}
function totalFixed()   { return totalFixedForBudget(B()); }
function totalVar(b)    { return (b.variableExpenses||[]).reduce((s,e)=>s+(e.amount||0),0); }
function availForVar(b) { return totalIncome(b)-totalFixed(); }
function remaining(b)   { return totalIncome(b)-totalFixed()-totalVar(b); }

// Formula evaluator — supports =75000-10000+500 style, basic BODMAS
function evalFormula(raw) {
  const s=String(raw??'').trim();
  if(!s.startsWith('=')) return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : 0;
  const expr=s.slice(1);
  let i=0;
  function ws(){while(/\s/.test(expr[i]||''))i++;}
  function number(){ws(); const m=expr.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/); if(!m)throw Error('number'); i+=m[0].length; return Number(m[0]);}
  function factor(){ws(); if(expr[i]==='('){i++;const v=add();ws();if(expr[i]!==')')throw Error(')');i++;return v;} if(expr[i]==='-'){i++;return -factor();} return number();}
  function mul(){let v=factor();for(;;){ws();if(expr[i]==='*'){i++;v*=factor();}else if(expr[i]==='/'){i++;const d=factor();if(d===0)throw Error('division');v/=d;}else break;}return v;}
  function add(){let v=mul();for(;;){ws();if(expr[i]==='+'){i++;v+=mul();}else if(expr[i]==='-'){i++;v-=mul();}else break;}return v;}
  try{const result=add();ws();if(i!==expr.length||!Number.isFinite(result))return 0;return Math.round(result*100)/100;}catch(e){return 0;}
}

function formulaPreview(raw) {
  const s = raw.trim();
  if (!s.startsWith('=')) return null;
  const val = evalFormula(s);
  return val !== 0 ? fmt(val) : null;
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────────
function renderAll() {
  document.getElementById('hdr-month').textContent = monthLabel(S.currentKey);
  // Update sync timestamps display
  const tsEl = document.getElementById('sync-timestamps');
  if(tsEl) {
    const saved = S.lastSaved ? '📤 ' + new Date(S.lastSaved).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '📤 Never saved';
    const synced = S.lastSynced ? '📥 ' + new Date(S.lastSynced).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : '📥 Never synced';
    tsEl.innerHTML = `<span>${saved}</span><span>${synced}</span>`;
  }
  renderPlan();
  if (activeTab==='history') renderHistory();
  if (activeTab==='settings') renderSettings();
  document.getElementById('bottom-bar').style.display = activeTab==='plan' ? 'flex':'none';
}

// ─── PLAN ─────────────────────────────────────────────────────────────────────
function renderPlan() {
  const b=B();
  const income=totalIncome(b);
  const fixed=totalFixed();
  const vari=totalVar(b);
  const avail=availForVar(b);
  const rem=remaining(b);
  const frozen=b.frozen;
  let html='';

  if (frozen) html+=`<div class="frozen-notice" style="justify-content:space-between;">
    <span>🔒 Budget finalized for ${monthLabel(S.currentKey)}</span>
    <button class="btn btn-outline" style="font-size:12px;padding:5px 12px;color:var(--amber-text);border-color:var(--amber-bg);" onclick="confirmUnfreeze()">✏️ Edit / Unfreeze</button>
  </div>`;

  // Funding Sources card
  html+=`<div class="card">
    <div class="card-header"><span class="card-title">Funding Sources</span><span class="card-total">${fmt(income)}</span></div>`;
  fundingSnapshot(b).forEach((e,i)=>{
    html+=`<div class="inc-row">
      <span class="inc-label">${esc(e.name)}</span>
      ${frozen
        ? `<span style="font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;">${fmt(e.amount||0)}</span>`
        : `<div style="display:flex;flex-direction:column;align-items:flex-end;">
             <input type="text" class="inc-input" value="${esc(e.rawInput || (e.amount||''))}" placeholder="0 or =expr"
               oninput="fundingInputChange(${i},this.value)"
               onchange="fundingInputCommit(${i},this.value)" />
             <div class="formula-hint" id="fsource-hint-${i}"></div>
           </div>`
      }
    </div>`;
  });
  html+=`<div class="inc-total-row">
    <span class="inc-total-label">Total Funds</span>
    <span style="font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;">${fmt(income)}</span>
  </div></div>`;

  // Metrics
  html+=`<div class="metrics">
    <div class="metric"><div class="metric-label">Fixed Commitments</div><div class="metric-val">${fmt(fixed)}</div></div>
    <div class="metric"><div class="metric-label">Planned Spending</div><div class="metric-val">${fmt(vari)}</div></div>
    <div class="metric"><div class="metric-label">Available for var.</div><div class="metric-val ${avail<0?'neg':'pos'}">${fmt(avail)}</div></div>
    <div class="metric"><div class="metric-label">Remaining</div><div class="metric-val ${rem<0?'neg':rem===0?'pos':'warn'}">${fmt(rem)}</div></div>
  </div>`;

  // Guidance
  if (income>0 && !frozen) {
    let msg='';
    if (avail<=0) msg=`Fixed Commitments (${fmt(fixed)}) exceed your income. Please review.`;
    else if (vari===0) msg=`After Fixed Commitments, you have ${fmt(avail)} available for Planned Spending.`;
    else if (rem<0) msg=`Planned Spending exceed available budget by ${fmt(Math.abs(rem))}. Consider reducing.`;
    else if (rem<avail*0.05) msg=`Excellent — only ${fmt(rem)} unallocated. Budget is nearly fully planned.`;
    else { const pct=Math.round(vari/avail*100); msg=`${pct}% of available budget allocated. ${fmt(rem)} still unallocated.`; }
    html+=`<div class="suggestion"><div class="suggestion-title">💡 Budget Guidance</div><div class="suggestion-text">${msg}</div></div>`;
  }

  // Fixed Commitments
  html+=`<div class="card">
    <div class="card-header"><span class="card-title">Fixed Commitments</span><span class="card-total">${fmt(fixed)}</span></div>`;
  monthlyFixed(b).forEach((e,i)=>{
    html+=`<div class="exp-row">
      <div><div class="exp-name">${esc(e.name)}</div>${e.date?`<div class="exp-date">Due ${esc(e.date)}</div>`:''}</div>
      <div class="exp-badge-amt">
        <span class="badge badge-fixed">Fixed</span>
        <span class="exp-amt">${fmt(e.amount)}</span>
        ${!frozen?`<button class="btn btn-outline" style="padding:6px 9px;font-size:16px;" onclick="openFixedMenu(${i})">⋮</button>`:''}
      </div>
    </div>`;
  });
  html+=`</div>`;

  // Planned Spending
  html+=`<div class="card">
    <div class="card-header"><span class="card-title">Planned Spending</span><span class="card-total">${fmt(vari)}</span></div>`;
  const vars=b.variableExpenses||[];
  if (!vars.length) html+=`<div class="empty">No Planned Spending yet.<br>Add CC payments, home expenses, etc.</div>`;
  vars.forEach((e,i)=>{
    html+=`<div class="exp-row" style="grid-template-columns:1fr auto;">
      <div><div class="exp-name">${e.name}</div>${e.date?`<div class="exp-date">Due ${e.date}</div>`:''}</div>
      <div class="exp-badge-amt">
        <span class="badge ${e.isCC?'badge-cc':'badge-var'}">${e.isCC?'CC':'Variable'}</span>
        ${frozen
          ? `<span class="exp-amt">${fmt(e.amount||0)}</span>`
          : `<div style="display:flex;flex-direction:column;align-items:flex-end;">
               <input type="text" class="var-input" value="${e.rawInput||e.amount||''}" placeholder="0 or =expr"
                 oninput="varInputChange(${i},this.value)"
                 onchange="varInputCommit(${i},this.value)"
                 onfocus="this.select()" />
               <div class="formula-hint" id="fhint-${i}"></div>
             </div>`
        }
        ${e.isCC&&!frozen ? `<button class="btn btn-cc" onclick="openCC(${i})">CC</button>` : ''}
        ${!frozen ? `<button class="btn btn-outline" style="padding:6px 9px;font-size:16px;" onclick="openVarMenu(${i})">⋮</button>` : ''}
      </div>
    </div>`;
  });

  if (!frozen) {
    html+=`<div class="add-form">
      <input type="text" id="nv-name" placeholder="Expense name" style="flex:1;min-width:100px;" />
      <input type="text" id="nv-amt" placeholder="Amount or =expr" style="width:120px;" />
      <select id="nv-date" style="width:72px;">
        <option value="">Day</option>
        ${Array.from({length:31},(_,i)=>`<option value="${i+1}th">${i+1}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap;">
        <input type="checkbox" id="nv-cc" style="width:16px;height:16px;accent-color:var(--accent);" /> CC
      </label>
      <button class="btn btn-primary" onclick="addVar()">Add</button>
    </div>`;
  }
  html+=`</div>`;

  // Freeze
  if (!frozen) html+=`<button class="btn btn-primary btn-full" style="margin-bottom:14px;" onclick="confirmFreeze()">🔒 Finalize Month</button>`;

  document.getElementById('tab-plan').innerHTML = html;
}

// ─── FUNDING SOURCES ───────────────────────────────────────────────────────────────────
function setIncome(field, val) {
  const b=B();
  const resolved = evalFormula(val);
  b[field] = resolved;
  b.tallyApproved=false;
  document.getElementById('save-btn').disabled=true;
  // Replace input with resolved value
  const idMap = {hdfc:'inc-hdfc',bom:'inc-bom',sbi:'inc-sbi',icici:'inc-icici'};
  const el = document.getElementById(idMap[field]||'');
  if (el) el.value = resolved || '';
  saveS(); renderPlan();
}

// ─── VARIABLE INPUTS ─────────────────────────────────────────────────────────
function varInputChange(i, raw) {
  const hint=document.getElementById('fhint-'+i);
  if (!hint) return;
  const preview=formulaPreview(raw);
  if (preview) { hint.textContent='= '+preview; hint.style.display='block'; }
  else { hint.style.display='none'; }
}

function varInputCommit(i, raw) {
  const b=B();
  const val = evalFormula(raw);
  b.variableExpenses[i].rawInput = String(raw || '');
  b.variableExpenses[i].amount = val;
  b.tallyApproved=false;
  document.getElementById('save-btn').disabled=true;
  // Replace input value with resolved number, hide hint
  const inputs = document.querySelectorAll('.var-input');
  if (inputs[i]) inputs[i].value = val || '';
  const hint = document.getElementById('fhint-'+i);
  if (hint) hint.style.display='none';
  saveS(); renderPlan();
}

function addVar() {
  const name=document.getElementById('nv-name').value.trim();
  const raw=document.getElementById('nv-amt').value.trim();
  const date=document.getElementById('nv-date').value;
  const isCC=document.getElementById('nv-cc').checked;
  if (!name) { toast('Enter an expense name','warn'); return; }
  const amt=evalFormula(raw||'0');
  const b=B();
  if (!b.variableExpenses) b.variableExpenses=[];
  b.variableExpenses.push({name, amount:amt, rawInput:raw||'', date, isCC});
  b.tallyApproved=false;
  document.getElementById('save-btn').disabled=true;
  saveS(); renderPlan();
  // Auto-open CC modal if CC and no amount
  if (isCC && !amt) { const idx=b.variableExpenses.length-1; openCC(idx); }
}

function removeVar(i) {
  const b=B(); b.variableExpenses.splice(i,1);
  b.tallyApproved=false;
  saveS(); renderPlan();
}

// ─── CC MODAL ─────────────────────────────────────────────────────────────────
function openCC(i) {
  const b=B(); const e=b.variableExpenses[i];
  activeCCIdx=i;
  document.getElementById('cc-title').textContent=e.name;
  document.getElementById('cc-desc').textContent=`Current amount: ${fmt(e.amount||0)}. Enter the full outstanding balance or a custom amount you want to pay this month. You can type a formula like =75000-5000.`;
  document.getElementById('cc-input').value=e.rawInput||e.amount||'';
  document.getElementById('cc-hint').style.display='none';
  document.getElementById('cc-modal').style.display='flex';
}

function ccFormulaHint() {
  const raw=document.getElementById('cc-input').value;
  const hint=document.getElementById('cc-hint');
  const preview=formulaPreview(raw);
  if (preview) { hint.textContent='= '+preview; hint.style.display='block'; }
  else hint.style.display='none';
}

function setCCFull() {
  const raw=document.getElementById('cc-input').value;
  applyCC(raw);
}
function setCCCustom() {
  const raw=document.getElementById('cc-input').value;
  applyCC(raw);
}
function applyCC(raw) {
  if (activeCCIdx<0) return;
  const b=B();
  b.variableExpenses[activeCCIdx].amount=evalFormula(raw||'0');
  b.variableExpenses[activeCCIdx].rawInput=raw;
  b.tallyApproved=false;
  document.getElementById('save-btn').disabled=true;
  document.getElementById('cc-modal').style.display='none';
  activeCCIdx=-1;
  saveS(); renderPlan();
}


function fundingInputChange(i, raw){
  const hint=document.getElementById('fsource-hint-'+i);
  const preview=formulaPreview(raw);
  if(hint){ hint.textContent=preview?'= '+preview:''; hint.style.display=preview?'block':'none'; }
}
function fundingInputCommit(i, raw){
  const b=B(), f=fundingSnapshot(b)[i];
  if(!f)return;
  f.rawInput=String(raw||'');
  f.amount=evalFormula(raw||'0');
  b.tallyApproved=false;
  saveS(); renderPlan();
}

function openFixedMenu(i){
  const e=monthlyFixed(B())[i];
  if(!e)return;
  document.getElementById('action-title').textContent=e.name;
  document.getElementById('action-content').innerHTML=`

// ─── TALLY ────────────────────────────────────────────────────────────────────
function runTally() {
  const b=B();
  const income=totalIncome(b);
  const fixed=totalFixed();
  const vari=totalVar(b);
  const total=fixed+vari;
  const diff=income-total;

  const cls=diff===0?'tally-ok':diff<0?'tally-over':'tally-under';
  const diffLabel=diff===0?'✓ Perfectly balanced':diff<0?`▲ Over budget by ${fmt(Math.abs(diff))}`:`${fmt(diff)} unallocated`;
  let advice='';
  if (diff<0) advice=`You are over by ${fmt(Math.abs(diff))}. Reduce Planned Spending to balance. Fixed Commitments are locked for this month.`;
  else if (diff===0) advice='Every rupee is accounted for. Budget is perfectly balanced.';
  else if (diff<income*0.05) advice=`Almost fully allocated — ${fmt(diff)} left. You may top up a variable item or carry it forward.`;
  else advice=`${fmt(diff)} is unallocated. Consider adding it to a variable category or treating it as savings.`;

  let varRows='';
  (b.variableExpenses||[]).forEach(e=>{
    varRows+=`<div class="tally-row"><span>${e.name}${e.date?` <small style="color:var(--text3)">(${e.date})</small>`:''}</span><span>${fmt(e.amount||0)}</span></div>`;
  });

  const html=`
    <div class="tally-card">
      <div class="tally-row"><span>Total income</span><span style="font-weight:600;">${fmt(income)}</span></div>
      <div class="tally-row"><span>Fixed Commitments</span><span>${fmt(fixed)}</span></div>
      <div class="tally-row"><span>Planned Spending</span><span>${fmt(vari)}</span></div>
      <div class="tally-row total"><span>Total outgoing</span><span>${fmt(total)}</span></div>
    </div>
    <div class="tally-diff ${cls}">${diffLabel}</div>
    <div class="tally-msg">${advice}</div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin:12px 0 8px;">Variable breakdown</div>
    <div class="tally-card">
      ${varRows||'<div class="empty" style="padding:14px;">No Planned Spending</div>'}
    </div>`;

  document.getElementById('tally-content').innerHTML=html;
  let btns=`<button class="btn btn-outline" style="flex:1;" onclick="document.getElementById('tally-modal').style.display='none'">Close</button>`;
  if (diff<=0) btns+=`<button class="btn btn-green" style="flex:1;" onclick="approveTally()">✓ Approve</button>`;
  else btns+=`<button class="btn btn-outline" style="flex:1;color:var(--amber-text);" onclick="approveTally()">Save anyway</button>`;
  document.getElementById('tally-btns').innerHTML=btns;
  document.getElementById('tally-modal').style.display='flex';
}

function approveTally() {
  const b=B(); b.tallyApproved=true; saveS();
  document.getElementById('save-btn').disabled=false;
  document.getElementById('tally-modal').style.display='none';
  toast('Budget review approved — you can now save or freeze','ok');
}

// ─── FORM POST (bypasses CORS, body always arrives) ─────────────────────────
function postViaForm(url, payload) {
  return new Promise((resolve) => {
    // Create a hidden iframe to receive the response
    const iframe = document.createElement('iframe');
    iframe.name = 'bp_post_frame';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    // Create a hidden form — uses application/x-www-form-urlencoded
    // which Apps Script reads via e.parameter.payload
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = 'bp_post_frame';
    form.enctype = 'application/x-www-form-urlencoded';
    form.style.display = 'none';

    // Add payload as a single hidden field
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payload);
    form.appendChild(input);

    document.body.appendChild(form);

    // Clean up after submit
    iframe.onload = () => {
      setTimeout(() => {
        form.remove();
        iframe.remove();
        resolve();
      }, 500);
    };

    form.submit();
  });
}

// ─── SYNC FROM SHEETS ────────────────────────────────────────────────────────
async function syncFromSheets() {
  if (!S.webhookUrl) { toast('Add your Apps Script URL in Settings first','warn'); return; }
  const btn = document.querySelector('[onclick="syncFromSheets()"]');
  if (btn) { btn.textContent='⏳ Syncing…'; btn.disabled=true; }
  try {
    const url = S.webhookUrl + '?action=load';
    const r = await fetch(url, { method:'GET', mode:'no-cors' });
    // no-cors returns opaque — we can't read the body directly.
    // Instead use an iframe trick via JSONP-style doGet
    fetchViaScript(S.webhookUrl + '?action=load&callback=onSheetsData');
  } catch(e) {
    if (btn) { btn.textContent='☁️ Sync from Sheets'; btn.disabled=false; }
    toast('Sync failed. Check your Apps Script URL.','err');
  }
}

function fetchViaScript(url) {
  // Remove any existing callback script
  const old = document.getElementById('jsonp-loader');
  if (old) old.remove();
  window.onSheetsData = function(data) {
    const old2 = document.getElementById('jsonp-loader');
    if (old2) old2.remove();
    if (!data || !data.budgets) { toast('No data found in Sheets','warn'); return; }
    // Merge: remote data wins for any month key, local kept if not in remote
    let merged = 0;
    Object.keys(data.budgets).forEach(k => {
      if (!S.budgets[k]) {
        S.budgets[k] = data.budgets[k];
        merged++;
      } else {
        // Remote frozen overrides local draft
        if (data.budgets[k].frozen && !S.budgets[k].frozen) {
          S.budgets[k] = data.budgets[k];
          merged++;
        }
      }
    });
    // Also restore fixedExpenses if local is default and remote has more
    if (data.fixedExpenses && data.fixedExpenses.length > S.fixedExpenses.length) {
      S.fixedExpenses = data.fixedExpenses;
    }
    saveS();
    renderAll();
    S.lastSynced = new Date().toISOString();
    saveS();
    toast(merged > 0 ? `✓ Synced — ${merged} month(s) loaded from Sheets` : '✓ Already up to date','ok');
    const btn = document.querySelector('[onclick="syncFromSheets()"]');
    if (btn) { btn.textContent='☁️ Sync from Sheets'; btn.disabled=false; }
  };
  const s = document.createElement('script');
  s.id = 'jsonp-loader';
  s.src = url;
  s.onerror = () => {
    toast('Could not reach Sheets. Check URL in Settings.','err');
    const btn = document.querySelector('[onclick="syncFromSheets()"]');
    if (btn) { btn.textContent='☁️ Sync from Sheets'; btn.disabled=false; }
  };
  document.body.appendChild(s);
}

function openMasterAction(title,name,amount,onSave,onRemove){
  document.getElementById('action-title').textContent=title;
  document.getElementById('action-content').innerHTML=`
    <div class="setting-label">Name</div>
    <input type="text" id="master-name" style="width:100%;" value="${esc(name)}">
    <div class="setting-note">Changes apply to future months. Existing month snapshots are unchanged.</div>`;
  document.getElementById('action-btns').innerHTML=`
    <button class="btn btn-outline" style="flex:1;" onclick="closeActionMenu()">Cancel</button>
    <button class="btn btn-outline" style="flex:1;color:var(--red);" onclick="masterRemove()">Archive / Remove</button>
    <button class="btn btn-primary" style="flex:1;" onclick="masterSave()">Save</button>`;
  window.__masterSave=()=>onSave(document.getElementById('master-name').value);
  window.__masterRemove=onRemove;
  document.getElementById('action-modal').style.display='flex';
}
function openMasterAmountAction(title,name,amount,raw,onSave,onRemove){
  document.getElementById('action-title').textContent=title;
  document.getElementById('action-content').innerHTML=`
    <div class="setting-label">Name</div>
    <input type="text" id="master-name" style="width:100%;" value="${esc(name)}">
    <div class="setting-label" style="margin-top:12px;">Default amount</div>
    <input type="text" id="master-amount" style="width:100%;" value="${esc(raw || amount || '')}" placeholder="Amount or =expression" oninput="masterFormulaHint()">
    <div class="formula-hint" id="master-hint"></div>
    <div class="setting-note">Changes apply to future months. Existing month snapshots are unchanged.</div>`;
  document.getElementById('action-btns').innerHTML=`
    <button class="btn btn-outline" style="flex:1;" onclick="closeActionMenu()">Cancel</button>
    <button class="btn btn-outline" style="flex:1;color:var(--red);" onclick="masterRemove()">Archive / Remove</button>
    <button class="btn btn-primary" style="flex:1;" onclick="masterSaveAmount()">Save</button>`;
  window.__masterSaveAmount=()=>onSave(document.getElementById('master-name').value,document.getElementById('master-amount').value);
  window.__masterRemove=onRemove;
  document.getElementById('action-modal').style.display='flex';
}
function masterSave(){ if(window.__masterSave)window.__masterSave(); closeActionMenu(); }
function masterSaveAmount(){ if(window.__masterSaveAmount)window.__masterSaveAmount(); closeActionMenu(); }
function masterRemove(){ if(window.__masterRemove)window.__masterRemove(); closeActionMenu(); }
function masterFormulaHint(){
  const raw=document.getElementById('master-amount')?.value||'', p=formulaPreview(raw), h=document.getElementById('master-hint');
  if(h){h.textContent=p?'= '+p:'';h.style.display=p?'block':'none';}
}


// ─── MONTH MANAGEMENT ────────────────────────────────────────────────────────
function openMonthPicker() {
  const keys=Object.keys(S.budgets).sort().reverse();
  let html='';
  keys.forEach(k=>{
    const b=S.budgets[k];
    html+=`<div class="mpicker-item ${k===S.currentKey?'current':''}" onclick="loadMonth('${k}')">
      <span style="font-size:15px;font-weight:500;">${monthLabel(k)}</span>
      ${b.frozen?'<span class="badge badge-frozen">Frozen</span>':'<span class="badge badge-var">Draft</span>'}
    </div>`;
  });
  document.getElementById('mpicker-list').innerHTML=html||'<div class="empty">No months yet</div>';
  document.getElementById('mpicker-modal').style.display='flex';
}

function loadMonth(key) {
  S.currentKey=key;
  if(!S.budgets[key]) S.budgets[key]=emptyBudget(key);
  saveS();
  document.getElementById('mpicker-modal').style.display='none';
  renderAll();
}

async function createNewMonth() {
  const keys=Object.keys(S.budgets).sort();
  let next;
  if(keys.length){
    const last=keys[keys.length-1];
    const [y,m]=last.split('-').map(Number);
    const d=new Date(y,m,1);
    next=monthKey(d.getFullYear(),d.getMonth());
  } else {
    const now=new Date();
    next=monthKey(now.getFullYear(),now.getMonth());
  }

  if(S.budgets[next]){
    S.currentKey=next;
    document.getElementById('mpicker-modal').style.display='none';
    renderAll();
    return;
  }

  try{
    await createBudgetInDb(next);
    S.currentKey=next;
    document.getElementById('mpicker-modal').style.display='none';
    renderAll();
    toast(`Created ${monthLabel(next)} from current masters`,'ok');
  }catch(e){
    console.error(e);
    toast('Could not create month: '+e.message,'err');
  }
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(t) {
  activeTab=t;
  ['plan','history','settings'].forEach(n=>{ document.getElementById('tab-'+n).style.display=n===t?'block':'none'; });
  document.querySelectorAll('.tab').forEach((el,i)=>{ el.classList.toggle('active',['plan','history','settings'][i]===t); });
  document.getElementById('bottom-bar').style.display=t==='plan'?'flex':'none';
  if(t==='history') renderHistory();
  if(t==='settings') renderSettings();
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg,type) {
  const c=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className=`toast toast-${type==='ok'?'ok':type==='warn'?'warn':'err'}`;
  el.textContent=msg; el.style.pointerEvents='auto';
  c.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

init();
