<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  .calculator {
    width: 100%;
    height: 100%;
    background: #1c1c1e;
    border-radius: 16px;
    padding: 2.5%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }

  .display {
    background: transparent;
    color: #ffffff;
    text-align: right;
    padding: 2% 3%;
    font-size: clamp(18px, 6vh, 42px);
    font-weight: 300;
    flex: 0 0 auto;
    word-wrap: break-word;
    overflow-x: auto;
    white-space: nowrap;
  }

  button {
    border: none;
    border-radius: 10px;
    width: 100%;
    height: 100%;
    min-height: 0;
    min-width: 0;
    font-size: clamp(14px, 3.5vh, 22px);
    cursor: pointer;
    color: #ffffff;
    background: #333336;
    transition: filter 0.1s ease;
  }

  button:active {
    filter: brightness(1.3);
  }

  .op {
    background: #ff9f0a;
  }

  .fn {
    background: #a5a5a5;
    color: #000000;
  }

  /* Portrait / narrow-tall box: classic 4-column, 5-row phone layout */
  .buttons-portrait {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 2.5%;
    flex: 1 1 auto;
    min-height: 0;
  }

  .buttons-landscape {
    display: none;
  }

  .wide-zero {
    grid-column: span 2;
  }

  /* Landscape / wide-short box: 5-column, 4-row layout */
  @media (min-aspect-ratio: 1/1) {
    .buttons-portrait {
      display: none;
    }

    .buttons-landscape {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 2.5%;
      flex: 1 1 auto;
      min-height: 0;
    }

    .wide-equals {
      grid-column: span 2;
    }
  }
</style>
</head>
<body>

<div class="calculator">
  <div class="display" id="display">0</div>

  <!-- Portrait layout: shown when box is taller than it is wide -->
  <div class="buttons-portrait">
    <button class="fn" onclick="clearAll()">AC</button>
    <button class="fn" onclick="toggleSign()">+/-</button>
    <button class="fn" onclick="percent()">%</button>
    <button class="op" onclick="chooseOperator('÷')">÷</button>

    <button onclick="appendDigit('7')">7</button>
    <button onclick="appendDigit('8')">8</button>
    <button onclick="appendDigit('9')">9</button>
    <button class="op" onclick="chooseOperator('×')">×</button>

    <button onclick="appendDigit('4')">4</button>
    <button onclick="appendDigit('5')">5</button>
    <button onclick="appendDigit('6')">6</button>
    <button class="op" onclick="chooseOperator('-')">-</button>

    <button onclick="appendDigit('1')">1</button>
    <button onclick="appendDigit('2')">2</button>
    <button onclick="appendDigit('3')">3</button>
    <button class="op" onclick="chooseOperator('+')">+</button>

    <button class="wide-zero" onclick="appendDigit('0')">0</button>
    <button onclick="appendDigit('.')">.</button>
    <button class="op" onclick="calculate()">=</button>
  </div>

  <!-- Landscape layout: shown when box is wider than it is tall -->
  <div class="buttons-landscape">
    <button class="fn" onclick="clearAll()">AC</button>
    <button class="fn" onclick="toggleSign()">+/-</button>
    <button class="fn" onclick="percent()">%</button>
    <button class="op" onclick="chooseOperator('÷')">÷</button>
    <button class="op" onclick="chooseOperator('×')">×</button>

    <button onclick="appendDigit('1')">1</button>
    <button onclick="appendDigit('2')">2</button>
    <button onclick="appendDigit('3')">3</button>
    <button onclick="appendDigit('4')">4</button>
    <button onclick="appendDigit('5')">5</button>

    <button onclick="appendDigit('6')">6</button>
    <button onclick="appendDigit('7')">7</button>
    <button onclick="appendDigit('8')">8</button>
    <button onclick="appendDigit('9')">9</button>
    <button onclick="appendDigit('0')">0</button>

    <button onclick="appendDigit('.')">.</button>
    <button class="op" onclick="chooseOperator('-')">-</button>
    <button class="op" onclick="chooseOperator('+')">+</button>
    <button class="op wide-equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
  let current = '0';
  let previous = null;
  let operator = null;
  let resetNext = false;

  const display = document.getElementById('display');

  function updateDisplay() {
    display.textContent = current;
  }

  function appendDigit(digit) {
    if (resetNext) {
      current = '0';
      resetNext = false;
    }
    if (digit === '.' && current.includes('.')) return;
    if (current === '0' && digit !== '.') {
      current = digit;
    } else {
      current += digit;
    }
    updateDisplay();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    resetNext = false;
    updateDisplay();
  }

  function toggleSign() {
    if (current !== '0') {
      current = current.startsWith('-') ? current.slice(1) : '-' + current;
      updateDisplay();
    }
  }

  function percent() {
    current = String(parseFloat(current) / 100);
    updateDisplay();
  }

  function chooseOperator(op) {
    if (operator && !resetNext) {
      calculate();
    }
    previous = current;
    operator = op;
    resetNext = true;
  }

  function calculate() {
    if (operator === null || previous === null) return;
    const a = parseFloat(previous);
    const b = parseFloat(current);
    let result;

    switch (operator) {
      case '+': result = a + b; break;
      case '-': result = a - b; break;
      case '×': result = a * b; break;
      case '÷': result = b === 0 ? NaN : a / b; break;
      default: return;
    }

    current = Number.isNaN(result) ? 'Error' : String(parseFloat(result.toFixed(10)));
    operator = null;
    previous = null;
    resetNext = true;
    updateDisplay();
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') appendDigit(e.key);
    else if (e.key === '.') appendDigit('.');
    else if (e.key === '+') chooseOperator('+');
    else if (e.key === '-') chooseOperator('-');
    else if (e.key === '*') chooseOperator('×');
    else if (e.key === '/') chooseOperator('÷');
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === 'Backspace') {
      current = current.length > 1 ? current.slice(0, -1) : '0';
      updateDisplay();
    }
  });
</script>

</body>
</html>
